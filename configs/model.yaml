# ============================================================
# Base model configuration for baselines 1 & 2 (inference/eval).
# base_model is UNDECIDED — pending teacher confirmation.
# RL framework (EasyR1) ships Qwen2.5-VL / Qwen3-VL; keep base
# model the SAME across eval and training for fair baselines.
# Fill `model_id` then run baselines; nothing else hardcodes it.
# ============================================================

base_model:
  # DEFAULT = Qwen3-VL-8B. Override with configs/model.qwen3vl.yaml or
  # configs/model.internvl3.yaml via --config. Same checkpoint feeds EasyR1.
  model_id: "Qwen/Qwen3-VL-8B-Instruct"
  family: "qwen"           # qwen | internvl (drives vision preprocessing)
  backend: "vllm"          # vllm | hf_transformers
  dtype: "bfloat16"
  tensor_parallel_size: 2  # 4x RTX 3090 (24G each); adjust per model size
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  max_num_seqs: 32          # small eval batch; low warmup memory on 24G
  limit_mm_per_prompt_image: 1

generation:
  temperature: 0.0         # greedy for reproducible baseline eval
  top_p: 1.0
  max_new_tokens: 1024
  seed: 258

# image handling: benchmarks are high-resolution; do NOT downscale below
# each benchmark's official expectation. Adapters may set per-source limits.
image:
  min_pixels: 256000
  max_pixels: 4096000
