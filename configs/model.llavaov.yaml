# ============================================================
# Base model: LLaVA-OneVision-7B (local weights, family=llava).
# THIRD base family for diversity: LLaVA vs Qwen-VL vs InternVL.
# (Qwen3-VL and Qwen2.5-VL are the SAME family — same vision path —
#  so LLaVA is what actually adds cross-architecture coverage.)
# Vision preprocessing: raw PIL image handed to vLLM (no qwen_vl_utils);
# LLaVA-OneVision applies its own anyres tiling internally.
# vLLM arch: LlavaOnevisionForConditionalGeneration (native support).
# NOTE: anyres tiling caps resolution below Qwen3-VL's native dynamic
#       resolution -> expect lower HR-Bench/V* as the honest 3rd-family point.
# ============================================================

base_model:
  model_id: "llava-hf/llava-onevision-qwen2-7b-ov-hf"   # resolved from HF_HOME cache
  family: "llava"
  backend: "vllm"
  dtype: "bfloat16"
  tensor_parallel_size: 2   # 7B bf16 + HR images -> 2x RTX 3090 (24G)
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  max_num_seqs: 32          # small eval batch; low warmup memory on 24G
  limit_mm_per_prompt_image: 1

generation:
  temperature: 0.0          # greedy for reproducible baseline eval
  top_p: 1.0
  max_new_tokens: 1024
  seed: 258

image:
  # LLaVA-OneVision tiles internally; these are advisory (ignored by PIL loader).
  min_pixels: 256000
  max_pixels: 4096000
